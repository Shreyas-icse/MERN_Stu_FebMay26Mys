<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning elements:relative</title>
    <style>
        body{
            background-color:skyblue;
        }
        .box-1{
            position: relative;
            top: 40px;
            left: 300px;
            width: 300px;
            height: 20px;
            border: 2px solid black;
            background-color: brown;
            border-radius: 10px;
            
            margin-left: 50px;
            text-align: center;
            color: blue;


        }
            .box-2{
                position: relative;
                top: 40px;

                left: 400px;
                
                width: 200px;
                height: 150px;
                border: 2px solid black;
                background-color: purple;
            }
            .box-3{
                position: relative;
                top: -70px;
                left: 420px;
                border: 2px solid black;
                width: 30px;
                height: 20px;
                background-color: yellow;
            }
            .box-4{
                position: relative;
                top: -70px;
                left:  550px;
                border: 2px solid black;
                width: 20px;
                height: 30px;
                background-color: green;
            }
            .box-5{
                position: relative;
                top: -70px;
                left:  480px;
                border: 2px solid black;
                width: 30px;
                height: 50px;
                background-color: blue;
            }
    </style>
</head>
<body>
    
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>
    <div class="box-4"></div>
    </div>
    <div class="box-5"></div>

    
    
</body>
</html>
