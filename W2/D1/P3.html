<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning elements:Absolute</title>
    <style>
        .wrapper{
            position: relative;
            height: 200px;
            background-color: skyblue;
        }
        .box{
            position: absolute;
            top: 20px;
            right: 30px;
            width: 200px;
            height: 100px;
            border: 2px solid black;
            background-color: lightblue;
            border-radius: 10px;
            box-shadow: 5px 4px gray;
            margin-left: 50px;
            text-align: center;
            color: blue;


        }
    </style>
</head>
<body>
    <h2>Absolute position</h2>
    <div class="wrapper">
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Temporibus numquam perferendis fugit molestias quia sint nobis, reiciendis iusto, odit asperiores blanditiis odio quidem, ea unde corporis cupiditate vero eligendi delectus?</p>
        <div class="box">Absolute Box</div>
    </div>
    
</body>
</html>
