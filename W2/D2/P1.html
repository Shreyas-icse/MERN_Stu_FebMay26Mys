<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<!-- 50,100,.....900 -->
<body class="bg-yellow-200">
    <p class="text-red-500">Hello tailwind css</p>
    <h2 class="text-blue-600 p-4 m-4 bg-violet-100">Utility Class</h2>

    <!-- Success:green,error:red,warning or alert:yellow,Info:blue -->

        <p class="font-bold"> success</p>

        </span>

        </div>
