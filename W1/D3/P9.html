<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child and descendent selector</title>
    <style>
    /* child selector */
    div > p{
        color: blue;
        font-weight: bold;
    }
    /* descendent selector */
    div span{
        color: brown;
         font-weight: bold;
         text-decoration: underline;
    }
    </style>
</head>
<body>
    <div>
        <p>Direct child </p>
        <section>
            <p>this is not a direct child</p>
        </section>
        <span>
            This span is inside a div tag
        </span>
        <div><span>Nested span tag</span></div>
    </div>
    
</body>
</html>
