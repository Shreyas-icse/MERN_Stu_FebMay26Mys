<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and pseudo class selector</title>
    <style>
    /* attribute selector */
    input[type = "text"]{
        border: 2px solid blue;
        padding: 5px;
        
    }
    /* pseudo class selector */
    button:hover{
        background-color: green;
        color: white;
    }
    </style>
</head>
<body>
    <input type="text" placeholder="This input is style">
    <input type="password" placeholder="this input is not styled">
    <button> hover on me</button>
    
</body>
</html>
