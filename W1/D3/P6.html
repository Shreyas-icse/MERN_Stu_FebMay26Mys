<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal css</title>
</head>
<style>
    /* Element selecter */
    p{
        color: red;
        font-size: 20px;
        font-style: italic;
    }
    h1{
        color: green;
    }
    h2{
        color: blue;
    }
</style>
<body>
    <p>This is a paragraph with internal CSS styling.</p>
    <h1>This is a heading 1</h1>
    <h2>This is a heading 2</h2>
</body>
</html>
