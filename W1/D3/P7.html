<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
</head>
<style>
    /* class selecter */
    .paratype1{
        background-color: red;
        font-weight: bold;
        font-style: normal;
    }
    .paratype2{
        color: blue;
        font-weight: bold;
        font-style: normal;
    }
    /* id selector */
    #main-title{
        text-decoration: underline;
    }
</style>
<body>
    <!-- class selector -->
    <p class="paratype1">This is a paragraph with internal CSS styling.</p>
    <p class="paratype2">this is a paragraph</p>
    <!-- id selector -->
     <h1 id="main-title">Main heading</h1>
</body>
</html>
