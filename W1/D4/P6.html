<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=*, initial-scale=1.0">
    <title> nested grid layouts</title>
    <style>
        .item{
            background-color: brown;
            color: white;
            padding: 20px;
            
        }
        
        .outer{
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            background-color: gray;
            padding: 2%;
        }
        .inner{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            
        }
        .inner-item{
            background-color: lightcoral;
            color: green;
            padding: 10px;
        }
        .item{
            background-color: brown;
            color: white;
            padding: 20px;
            
        }
        

    </style>
</head>
<body>
    
    
    <!-- Nested grid layouts -->
    <div class="outer"> 
        <div class="item">1</div>
        <div class="inner">
            <div class="item inner-item">Nested A</div>
            <div class="item inner-item">Nested B</div>
            <div class="item inner-item">Nested C</div>
            <div class="item inner-item">Nested D</div>
        </div>
</div>

</body>
</html>
