<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=*, initial-scale=1.0">
    <title>grid layouts</title>
    <style>
        
        
        
        .grid-fr{
            display: grid;
            /* 3 equal size cols */
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
            margin: 20px;
        }
        .item{
            background-color: mediumaquamarine;
            color: white;
            padding: 20px;
            text-align: center;
        }
        

    </style>
</head>
<body>
    
    
    <!--  Fixed width column using fractional columns -->
    <div class="grid-fr">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">1</div>
    </div>


</body>
</html>
